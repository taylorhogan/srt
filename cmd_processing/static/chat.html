<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iris Observatory</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iris">
<meta name="theme-color" content="#161b22">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f85149; transition: background 0.3s; flex-shrink: 0;
  }
  .status-dot.connected { background: #3fb950; }

  .ticker-wrap {
    flex: 1; overflow: hidden; min-width: 0;
    mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
  }
  #ticker-track { display: inline-flex; align-items: center; white-space: nowrap; will-change: transform; }
  @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .t-item { display: inline-flex; align-items: baseline; gap: 5px; padding: 0 18px; }
  .t-lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .t-val { font-size: 13px; color: #c9d1d9; }
  .t-val.safe { color: #3fb950; } .t-val.unsafe { color: #f85149; } .t-val.active { color: #58a6ff; }
  .t-val.waxing { color: #3fb950; } .t-val.waning { color: #d29922; }
  .t-sep { color: #30363d; font-size: 12px; padding: 0 2px; }

  .head-meta { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; gap: 1px; }
  .head-sub { font-size: 10.5px; color: #8b949e; letter-spacing: 0.04em; white-space: nowrap; }
  .head-sub.busy { color: #58a6ff; }
  .head-clock { font-size: 12px; color: #8b949e; letter-spacing: 0.06em; }

  /* ── Imaging activity bar ─────────────────────────────── */
  #imaging-bar {
    background: #0d1f14; border-bottom: 1px solid #1a3a24;
    padding: 4px 16px; display: none; align-items: center; gap: 12px; flex-shrink: 0;
  }
  #imaging-bar .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3fb950; flex-shrink: 0;
    animation: live-pulse 1.4s ease-in-out infinite;
  }
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #imaging-bar .ticker-wrap {
    mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
  }
  #imaging-track { display: inline-flex; align-items: center; white-space: nowrap; will-change: transform; }
  .it-item { display: inline-flex; align-items: baseline; gap: 5px; padding: 0 16px; }
  .it-lbl { font-size: 10px; color: #4a7a55; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .it-val { font-size: 12px; color: #7ee89a; }
  .it-sep { color: #1a3a24; font-size: 12px; padding: 0 2px; }

  /* ── Jobs panel ───────────────────────────────────────── */
  #jobs-panel {
    flex: 1; overflow-y: auto; padding: 12px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #jobs-panel::-webkit-scrollbar { width: 6px; }
  #jobs-panel::-webkit-scrollbar-track { background: transparent; }
  #jobs-panel::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .empty-hint {
    text-align: center; color: #6e7681; font-size: 12px; line-height: 1.7;
    padding: 28px 24px 8px;
  }
  .empty-hint .glyph { font-size: 34px; opacity: 0.35; display: block; margin-bottom: 10px; }

  .card {
    background: #161b22; border: 1px solid #30363d; border-left: 3px solid #9aa6b2;
    border-radius: 10px; padding: 11px 13px; cursor: pointer; position: relative;
    transition: transform .12s ease, border-color .2s ease;
  }
  .card:active { transform: scale(0.99); }
  .card.system { border-left-color: #58a6ff; background: #11161d; }
  .card.swipeable { touch-action: pan-y; }
  .card.dragging { transition: none; }
  .card.removing { transition: transform .2s ease, opacity .2s ease; }

  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-title {
    font-size: 14px; font-weight: 600; color: #e6edf3; display: flex; align-items: center; gap: 8px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .unread {
    background: #d29922; color: #1a1206; font-size: 10px; font-weight: 700;
    border-radius: 9px; padding: 1px 6px; flex-shrink: 0;
  }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid;
    border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap; flex-shrink: 0;
  }
  .pulse { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .card-log {
    font-size: 11.5px; color: #7d8590; margin-top: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 6px; margin-top: 9px; display: block; cursor: zoom-in; }
  .card-bottom { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .progress-wrap { flex: 1; height: 3px; border-radius: 3px; background: #21262d; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .progress-wrap.indet .progress-bar { width: 35% !important; animation: indet 1.4s ease-in-out infinite; }
  @keyframes indet { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .j-elapsed { font-size: 11px; color: #6e7681; min-width: 30px; text-align: right; }
  .card-cancel {
    position: absolute; top: 9px; right: 11px; font-size: 10px; color: #f0a3a3;
    background: #2a1414; border: 1px solid #5a2a2a; border-radius: 6px; padding: 2px 8px;
    cursor: pointer; display: none;
  }
  .card.running .card-cancel { display: block; }
  .card.running .badge { padding-right: 7px; }
  .card.running .card-top { padding-right: 64px; }

  /* ── Input bar ────────────────────────────────────────── */
  #input-area {
    background: #161b22; border-top: 1px solid #30363d; padding: 10px 14px;
    display: flex; gap: 10px; flex-shrink: 0;
  }
  #cmd-input {
    flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 11px 14px; color: #c9d1d9; font-family: inherit; font-size: 15px; outline: none;
  }
  #cmd-input:focus { border-color: #58a6ff; }
  #cmd-input::placeholder { color: #484f58; }
  #send-btn, #photo-btn {
    border-radius: 8px; width: 42px; height: 42px; font-size: 18px; cursor: pointer;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  #send-btn { background: #1f6feb; color: #fff; border: 1px solid #388bfd; }
  #send-btn:hover { background: #388bfd; }
  #photo-btn { background: #161b22; color: #8b949e; border: 1px solid #30363d; }
  #photo-btn:hover { background: #1f2937; }
  #photo-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Detail sheet ─────────────────────────────────────── */
  #sheet-backdrop {
    position: fixed; inset: 0; background: rgba(1,4,9,0.6); backdrop-filter: blur(2px);
    display: none; align-items: flex-end; z-index: 900;
  }
  #sheet-backdrop.open { display: flex; }
  #sheet {
    width: 100%; max-height: 84%; background: #0d1117; border: 1px solid #30363d;
    border-bottom: none; border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
    overflow: hidden; animation: slideUp .26s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 38px; height: 4px; border-radius: 4px; background: #30363d; margin: 9px auto 4px; }
  .sheet-head {
    padding: 6px 18px 12px; display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; border-bottom: 1px solid #21262d;
  }
  .sheet-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
  .sheet-cmd { font-size: 12px; color: #6e7681; margin-top: 4px; word-break: break-word; }
  .sheet-log { flex: 1; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .sheet-log::-webkit-scrollbar { width: 6px; }
  .sheet-log::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .log-line { font-size: 12.5px; line-height: 1.5; }
  .log-time { color: #475061; margin-right: 9px; }
  .log-text { color: #c9d1d9; white-space: pre-wrap; word-wrap: break-word; }
  .log-text a { color: #58a6ff; }
  .log-line.err .log-text { color: #f0a3a3; }
  .log-line img { max-width: 100%; max-height: 520px; border-radius: 6px; margin-top: 6px; cursor: pointer; display: block; }
  .log-line img:hover { opacity: 0.88; }
  .log-line table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11.5px; }
  .log-line th { text-align: left; color: #8b949e; padding: 4px 6px; border-bottom: 1px solid #30363d; }
  .log-line td { padding: 4px 6px; color: #c9d1d9; border-bottom: 1px solid #21262d; }
  .sheet-foot { padding: 11px 18px 16px; border-top: 1px solid #21262d; }
  .sheet-btn { width: 100%; padding: 13px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sheet-btn.cancel { border: 1px solid #5a2a2a; background: #2a1414; color: #f0a3a3; }
  .sheet-btn.close { border: 1px solid #30363d; background: #161b22; color: #c9d1d9; }

  /* ── Lightbox ─────────────────────────────────────────── */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 6px; object-fit: contain; touch-action: none; will-change: transform; cursor: grab; transition: transform 0.04s linear; }
  #lightbox img.grabbing { cursor: grabbing; }
  #lightbox-close { position: fixed; top: 14px; right: 18px; font-size: 28px; color: #c9d1d9; cursor: pointer; line-height: 1; user-select: none; z-index: 1001; }
  #lightbox-close:hover { color: #fff; }
</style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <div class="ticker-wrap"><div id="ticker-track"></div></div>
    <div class="head-meta">
      <div class="head-sub" id="head-sub">Idle</div>
      <div class="head-clock" id="head-clock">--:--</div>
    </div>
  </header>

  <div id="imaging-bar">
    <div class="live-dot"></div>
    <div class="ticker-wrap" style="flex:1;overflow:hidden;min-width:0;"><div id="imaging-track"></div></div>
  </div>

  <div id="lightbox">
    <span id="lightbox-close">×</span>
    <img id="lightbox-img" src="" alt="Full size image">
  </div>

  <div id="jobs-panel"></div>

  <div id="input-area">
    <input type="file" id="photo-input" accept="image/*" style="display:none">
    <input type="text" id="cmd-input" placeholder="Enter a command… (tonight, status, help)" autocomplete="off">
    <button id="photo-btn" title="Upload photo">🔭</button>
    <button id="send-btn">↑</button>
  </div>

  <div id="sheet-backdrop">
    <div id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div style="min-width:0;">
          <div class="sheet-title" id="sheet-title"></div>
          <div class="sheet-cmd" id="sheet-cmd"></div>
        </div>
        <span class="badge" id="sheet-badge"></span>
      </div>
      <div class="sheet-log" id="sheet-log"></div>
      <div class="sheet-foot" id="sheet-foot"></div>
    </div>
  </div>

<script>
(function() {
  // ── Element refs ────────────────────────────────────────────────
  const panel      = document.getElementById('jobs-panel');
  const input      = document.getElementById('cmd-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusDot  = document.getElementById('status-dot');
  const headSub    = document.getElementById('head-sub');
  const headClock  = document.getElementById('head-clock');
  const lightbox   = document.getElementById('lightbox');
  const lightboxImg= document.getElementById('lightbox-img');
  const backdrop   = document.getElementById('sheet-backdrop');
  let ws = null;

  // ── Job model state ─────────────────────────────────────────────
  const SYSTEM_ID = 'system';
  const jobs = new Map();          // id -> job
  let imaging = { active: false }; // latest /api/imaging_ticker payload
  let lastImageFrameCount = null;  // frame_count when artifacts were last fetched
  let latestImageUrl = null;       // URL of the eagerly-rendered latest frame
  let statsImageUrl = null;        // URL of the eagerly-rendered stats graph
  let fetchingArtifacts = false;   // in-flight guard for /api/imaging_artifacts
  let openDetailId = null;
  let now = Date.now();

  const KIND_COLOR = {
    slew: '#7cc4ff', search: '#c9a8ff', image: '#ffd27c',
    focus: '#8affc1', quick: '#9aa6b2', system: '#58a6ff',
  };
  const STATUS_META = {
    QUEUED:    { label: 'QUEUED',    color: '#8b949e' },
    RUNNING:   { label: 'RUNNING',   color: '#d29922' },
    DONE:      { label: 'DONE',      color: '#3fb950' },
    ERROR:     { label: 'ERROR',     color: '#f85149' },
    CANCELLED: { label: 'CANCELLED', color: '#f85149' },
    SYSTEM:    { label: 'FEED',      color: '#58a6ff' },
  };
  const TERMINAL = new Set(['DONE', 'ERROR', 'CANCELLED']);

  // ── Lightbox pinch-to-zoom ──────────────────────────────────────
  let lbScale = 1, lbX = 0, lbY = 0, lbLastTap = 0, lbPinchStartDist = 0, lbPinchStartScale = 1, lbDragStart = null;
  function lbApplyTransform() { lightboxImg.style.transform = `translate(${lbX}px,${lbY}px) scale(${lbScale})`; }
  function lbReset() { lbScale = 1; lbX = 0; lbY = 0; lightboxImg.style.transform = ''; }
  function pinchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  lightboxImg.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) { lbPinchStartDist = pinchDist(e.touches); lbPinchStartScale = lbScale; lbDragStart = null; }
    else if (e.touches.length === 1) {
      const t = e.touches[0]; const tnow = Date.now();
      if (tnow - lbLastTap < 300) { lbLastTap = 0; if (lbScale > 1) lbReset(); else { lbScale = 2.5; lbApplyTransform(); } return; }
      lbLastTap = tnow; lbDragStart = { x: t.clientX - lbX, y: t.clientY - lbY }; lightboxImg.classList.add('grabbing');
    }
  }, { passive: false });
  lightboxImg.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) { const d = pinchDist(e.touches); lbScale = Math.min(5, Math.max(1, lbPinchStartScale * (d / lbPinchStartDist))); lbApplyTransform(); }
    else if (e.touches.length === 1 && lbDragStart && lbScale > 1) { const t = e.touches[0]; lbX = t.clientX - lbDragStart.x; lbY = t.clientY - lbDragStart.y; lbApplyTransform(); }
  }, { passive: false });
  lightboxImg.addEventListener('touchend', (e) => { e.preventDefault(); lightboxImg.classList.remove('grabbing'); if (lbScale < 1.05) lbReset(); lbDragStart = null; }, { passive: false });
  function openLightbox(url) { lbReset(); lightboxImg.src = url; lightbox.classList.add('open'); }
  function closeLightbox() { lightbox.classList.remove('open'); lbReset(); lightboxImg.src = ''; }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeLightbox(); if (openDetailId) closeDetail(); } });

  // ── Helpers ─────────────────────────────────────────────────────
  function fmtTime(epochSec) { return new Date(epochSec * 1000).toLocaleTimeString([], { hour12: false }); }
  function fmtClock(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function fmtTimeLeft(secs) {
    if (secs == null) return null;
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }
  function imagingSummary() {
    const lf = imaging.last_frame || {};
    const parts = [];
    if (lf.filter) parts.push(lf.filter);
    parts.push(`${imaging.frame_count || 0} frames`);
    if (lf.fwhm_arcsec != null) parts.push(`FWHM ${lf.fwhm_arcsec.toFixed(2)}″`);
    if (lf.eccentricity != null) parts.push(`ecc ${lf.eccentricity.toFixed(2)}`);
    const left = fmtTimeLeft(imaging.remaining_seconds);
    if (left) parts.push(`${left} left`);
    return parts.join(' · ');
  }

  // Per-filter sub counts taken so far this session ("tonight"), as a single
  // line: "L 12 · R 8 · G 8 · B 8". Ordered L,R,G,B,Ha,OIII,SII first, then
  // any other filters alphabetically.
  const FILTER_ORDER = ['L', 'R', 'G', 'B', 'Ha', 'OIII', 'SII'];
  function imagingFilterCounts() {
    const fc = imaging.filter_counts || {};
    const keys = Object.keys(fc);
    if (!keys.length) return '';
    keys.sort((a, b) => {
      const ia = FILTER_ORDER.indexOf(a), ib = FILTER_ORDER.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      return a.localeCompare(b);
    });
    return keys.map((k) => `${k} ${fc[k]}`).join(' · ');
  }

  function linkify(text) {
    const esc = (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function lastLogText(job) {
    if (!job.log.length) return job.status === 'QUEUED' ? 'Queued…' : '';
    const e = job.log[job.log.length - 1];
    if (e.text) return e.text;
    if (e.image_url) return '🖼 image attached';
    if (e.html) return e.html.indexOf('<audio') !== -1 ? '🔊 audio clip' : '▦ table';
    return '';
  }

  function elapsedSec(job) {
    if (job.kind === 'system') return null;
    const start = (job.started_at || job.created_at) * 1000;
    const end = (job.finished_at ? job.finished_at * 1000 : now);
    return Math.max(0, (end - start) / 1000);
  }

  // ── Reducer ─────────────────────────────────────────────────────
  function normalizeJob(j) {
    return Object.assign({ log: [], progress: null, unread: 0 }, j, { log: j.log ? j.log.slice() : [] });
  }

  function applyHistory(snapshot) {
    jobs.clear();
    (snapshot || []).forEach((j) => jobs.set(j.id, normalizeJob(j)));
    // A reconnect should not resurrect a detail sheet for a job that's gone.
    if (openDetailId && !jobs.has(openDetailId)) closeDetail();
    renderPanel();
    if (openDetailId) renderSheet();
  }

  function applyEvent(ev) {
    if (ev.kind === 'created') {
      jobs.set(ev.job.id, normalizeJob(ev.job));
    } else if (ev.kind === 'update') {
      const job = jobs.get(ev.id); if (!job) return;
      if (ev.status !== undefined) job.status = ev.status;
      if (ev.progress !== undefined) job.progress = ev.progress;
      if (ev.started_at !== undefined) job.started_at = ev.started_at;
      if (ev.finished_at !== undefined) job.finished_at = ev.finished_at;
    } else if (ev.kind === 'log') {
      const job = jobs.get(ev.id); if (!job) return;
      job.log.push(ev.entry);
      if (ev.status !== undefined) job.status = ev.status;
      // §7 unread: never steal focus — just count, unless its sheet is open.
      if (openDetailId !== ev.id && job.kind !== 'system') job.unread = (job.unread || 0) + 1;
    } else if (ev.kind === 'removed') {
      jobs.delete(ev.id);
      if (openDetailId === ev.id) closeDetail();
    }
    renderPanel();
    if (openDetailId && (ev.id === openDetailId || ev.kind === 'created')) renderSheet();
  }

  // ── Rendering ───────────────────────────────────────────────────
  function sortedJobs() {
    // Newest user job at the bottom (chat-style); the system feed pins to the top.
    return [...jobs.values()].sort((a, b) => {
      if (a.kind === 'system') return -1;
      if (b.kind === 'system') return 1;
      return a.created_at - b.created_at;
    });
  }

  function renderPanel() {
    // Preserve the reader's position across the full rebuild: stick to the
    // newest card if already at the bottom, otherwise keep the current scroll.
    const wasAtBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight < 60;
    const prevScroll = panel.scrollTop;

    const list = sortedJobs();
    const userJobs = list.filter((j) => j.kind !== 'system');
    panel.innerHTML = '';

    if (userJobs.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.innerHTML = '<span class="glyph">◎</span>No active jobs.<br>'
        + 'Try: <b>tonight</b> · <b>status</b> · <b>image ngc891</b> · <b>latest</b> · <b>help</b>';
      panel.appendChild(hint);
    }

    list.forEach((job) => panel.appendChild(renderCard(job)));
    updateElapsed();
    updateHeaderCounts();

    panel.scrollTop = wasAtBottom ? panel.scrollHeight : prevScroll;
  }

  // Swipe-left to dismiss a finished card. Pointer Events cover touch + mouse;
  // `touch-action: pan-y` (set via .swipeable) keeps native vertical scrolling.
  function attachSwipe(card, jobId, onSwiped) {
    const LOCK = 8;        // px before we commit to a horizontal drag
    let startX = 0, startY = 0, dx = 0, dragging = false, decided = false;

    card.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = false; decided = false;
    });
    card.addEventListener('pointermove', (e) => {
      if (startX === 0 && startY === 0) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (!decided) {
        if (Math.abs(mx) < LOCK && Math.abs(my) < LOCK) return;
        decided = true;
        dragging = mx < 0 && Math.abs(mx) > Math.abs(my); // leftward + horizontal
        if (dragging) { card.classList.add('dragging'); card.setPointerCapture(e.pointerId); }
      }
      if (!dragging) return;
      dx = Math.min(0, mx);
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = String(Math.max(0.3, 1 + dx / (card.offsetWidth || 1)));
    });
    function release() {
      card.classList.remove('dragging');
      const threshold = Math.max(80, (card.offsetWidth || 0) * 0.35);
      if (dragging && -dx >= threshold) {
        onSwiped();
        card.classList.add('removing');
        card.style.transform = 'translateX(-100%)';
        card.style.opacity = '0';
        removeJob(jobId);
        jobs.delete(jobId);          // optimistic; 'removed' broadcast is idempotent
        setTimeout(renderPanel, 200);
      } else {
        if (dragging) onSwiped();    // a horizontal drag shouldn't open the sheet
        card.style.transform = '';
        card.style.opacity = '';
      }
      startX = 0; startY = 0; dx = 0; dragging = false; decided = false;
    }
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', release);
  }

  function renderCard(job) {
    const meta = STATUS_META[job.status] || STATUS_META.QUEUED;
    const accent = KIND_COLOR[job.kind] || KIND_COLOR.quick;
    const running = job.status === 'RUNNING';
    const isSystem = job.kind === 'system';

    const card = document.createElement('div');
    const swipeable = !isSystem && TERMINAL.has(job.status);
    card.className = 'card' + (running ? ' running' : '') + (isSystem ? ' system' : '') + (swipeable ? ' swipeable' : '');
    card.style.borderLeftColor = accent;
    let swiped = false;
    card.onclick = () => { if (swiped) { swiped = false; return; } openDetail(job.id); };
    if (swipeable) attachSwipe(card, job.id, () => { swiped = true; });

    // Dual-mode feed card: live imaging summary while imaging, normal feed when idle.
    const imagingMode = isSystem && imaging.active;
    if (imagingMode) { card.style.borderLeftColor = '#3fb950'; }

    const top = document.createElement('div'); top.className = 'card-top';
    const title = document.createElement('div'); title.className = 'card-title';
    title.appendChild(document.createTextNode(imagingMode ? `Live ${imaging.target || ''}`.trim() : job.title));
    if (job.unread > 0) { const u = document.createElement('span'); u.className = 'unread'; u.textContent = job.unread; title.appendChild(u); }
    const badge = document.createElement('span'); badge.className = 'badge';
    const badgeColor = imagingMode ? '#3fb950' : meta.color;
    const badgeLabel = imagingMode ? 'LIVE' : meta.label;
    badge.style.color = badgeColor; badge.style.borderColor = badgeColor + '66';
    if (running || imagingMode) { const p = document.createElement('span'); p.className = 'pulse'; p.style.background = badgeColor; badge.appendChild(p); }
    badge.appendChild(document.createTextNode(badgeLabel));
    top.appendChild(title); top.appendChild(badge);
    card.appendChild(top);

    const log = document.createElement('div'); log.className = 'card-log';
    log.textContent = imagingMode ? imagingSummary() : lastLogText(job);
    if (job.status === 'QUEUED' && job.resource_class === 'mount_exclusive') log.textContent = 'Waiting for mount…';
    card.appendChild(log);

    // Live card: per-filter sub counts taken tonight, on their own line.
    if (imagingMode) {
      const fc = imagingFilterCounts();
      if (fc) {
        const fcLine = document.createElement('div'); fcLine.className = 'card-log';
        fcLine.style.marginTop = '3px';
        fcLine.textContent = fc;
        card.appendChild(fcLine);
      }
    }

    // Imaging card shows the newest sub eagerly. The image is pre-rendered on
    // each new frame (see fetchImagingTicker), so it's already here, not lazy.
    if (imagingMode && latestImageUrl) {
      const img = document.createElement('img'); img.className = 'card-img';
      img.src = latestImageUrl; img.alt = 'latest frame';
      img.onclick = (e) => { e.stopPropagation(); openLightbox(latestImageUrl); };
      card.appendChild(img);
    }

    if (!isSystem) {
      const bottom = document.createElement('div'); bottom.className = 'card-bottom';
      const pw = document.createElement('div'); pw.className = 'progress-wrap';
      const pb = document.createElement('div'); pb.className = 'progress-bar';
      pb.style.background = accent;
      if (job.progress != null) {
        pb.style.width = job.progress + '%';
      } else if (running) {
        pw.classList.add('indet'); pb.style.width = '35%';
      } else if (TERMINAL.has(job.status)) {
        pb.style.width = '100%'; pb.style.opacity = (job.status === 'DONE') ? '1' : '0.3';
      } else { pb.style.width = '0%'; }
      pw.appendChild(pb);
      const el = document.createElement('div'); el.className = 'j-elapsed';
      el.dataset.jobId = job.id;
      bottom.appendChild(pw); bottom.appendChild(el);
      card.appendChild(bottom);

      if (running) {
        const cancel = document.createElement('div'); cancel.className = 'card-cancel'; cancel.textContent = 'Cancel';
        cancel.onclick = (e) => { e.stopPropagation(); cancelJob(job.id); };
        card.appendChild(cancel);
      }
    }
    return card;
  }

  function updateElapsed() {
    panel.querySelectorAll('.j-elapsed').forEach((el) => {
      const job = jobs.get(el.dataset.jobId);
      if (!job) return;
      const s = elapsedSec(job);
      el.textContent = s == null ? '' : (s < 60 ? s.toFixed(0) + 's' : Math.floor(s / 60) + 'm ' + Math.floor(s % 60) + 's');
    });
  }

  function updateHeaderCounts() {
    const active = [...jobs.values()].filter((j) => j.status === 'RUNNING' || j.status === 'QUEUED').length;
    if (active > 0) { headSub.textContent = active + ' job' + (active > 1 ? 's' : '') + ' active'; headSub.classList.add('busy'); }
    else { headSub.textContent = 'Idle'; headSub.classList.remove('busy'); }
  }

  // ── Detail sheet ────────────────────────────────────────────────
  function openDetail(id) {
    openDetailId = id;
    const job = jobs.get(id);
    if (job) job.unread = 0;
    renderPanel();
    renderSheet();
    backdrop.classList.add('open');
  }
  function closeDetail() { openDetailId = null; backdrop.classList.remove('open'); }

  function renderSheet() {
    if (openDetailId === SYSTEM_ID && imaging.active) { renderImagingSheet(); return; }
    const job = jobs.get(openDetailId);
    if (!job) { closeDetail(); return; }
    const meta = STATUS_META[job.status] || STATUS_META.QUEUED;
    document.getElementById('sheet-title').textContent = job.title;
    const cmdEl = document.getElementById('sheet-cmd');
    cmdEl.textContent = job.command ? '“' + job.command + '”' : '';
    const badge = document.getElementById('sheet-badge');
    badge.textContent = meta.label; badge.style.color = meta.color; badge.style.borderColor = meta.color + '66';

    const logEl = document.getElementById('sheet-log');
    const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
    logEl.innerHTML = '';
    job.log.forEach((e) => {
      const line = document.createElement('div');
      line.className = 'log-line' + (e.text && e.text.startsWith('✕') ? ' err' : '');
      const t = document.createElement('span'); t.className = 'log-time'; t.textContent = fmtTime(e.timestamp);
      line.appendChild(t);
      if (e.html) {
        const w = document.createElement('span'); w.className = 'log-text'; w.innerHTML = e.html; line.appendChild(w);
      } else if (e.text) {
        const w = document.createElement('span'); w.className = 'log-text'; w.innerHTML = linkify(e.text); line.appendChild(w);
      }
      if (e.image_url) {
        const img = document.createElement('img'); img.src = e.image_url; img.alt = 'result';
        img.onclick = () => openLightbox(e.image_url); line.appendChild(img);
      }
      logEl.appendChild(line);
    });
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;

    const foot = document.getElementById('sheet-foot');
    foot.innerHTML = '';
    const btn = document.createElement('button');
    if (job.status === 'RUNNING') { btn.className = 'sheet-btn cancel'; btn.textContent = 'Cancel job'; btn.onclick = () => cancelJob(job.id); }
    else { btn.className = 'sheet-btn close'; btn.textContent = 'Close'; btn.onclick = closeDetail; }
    foot.appendChild(btn);
  }
  // Imaging-mode detail: latest-frame image + per-DSO stats graph (both
  // pre-rendered by frame_watcher, fetched eagerly when a new sub arrives).
  function renderImagingSheet() {
    document.getElementById('sheet-title').textContent = `Live ${imaging.target || ''}`.trim() || 'Live';
    const fcText = imagingFilterCounts();
    document.getElementById('sheet-cmd').textContent = imaging.frame_count != null
      ? String(imaging.frame_count) + ' frames' + (fcText ? '  (' + fcText + ')' : '') : '';
    const badge = document.getElementById('sheet-badge');
    badge.textContent = 'IMAGING'; badge.style.color = '#3fb950'; badge.style.borderColor = '#3fb95066';

    const logEl = document.getElementById('sheet-log');
    logEl.innerHTML = '';

    const stale = imaging.frame_count !== lastImageFrameCount;
    if (stale) fetchImagingArtifacts();

    const imgLine = document.createElement('div'); imgLine.className = 'log-line';
    if (latestImageUrl) {
      const img = document.createElement('img'); img.src = latestImageUrl; img.alt = 'latest frame';
      img.onclick = () => openLightbox(latestImageUrl); imgLine.appendChild(img);
    } else {
      const note = document.createElement('span'); note.className = 'log-text';
      note.textContent = 'Rendering latest frame…'; imgLine.appendChild(note);
    }
    logEl.appendChild(imgLine);

    const statsLine = document.createElement('div'); statsLine.className = 'log-line';
    if (statsImageUrl) {
      const img = document.createElement('img'); img.src = statsImageUrl; img.alt = 'stats graph';
      img.onclick = () => openLightbox(statsImageUrl); statsLine.appendChild(img);
    } else {
      const note = document.createElement('span'); note.className = 'log-text';
      note.textContent = 'Stats graph will appear after the next sub is analysed.';
      statsLine.appendChild(note);
    }
    logEl.appendChild(statsLine);

    const foot = document.getElementById('sheet-foot');
    foot.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'sheet-btn close'; btn.textContent = 'Close'; btn.onclick = closeDetail;
    foot.appendChild(btn);
  }

  function fetchImagingArtifacts() {
    if (fetchingArtifacts) return;
    fetchingArtifacts = true;
    const atCount = imaging.frame_count;
    fetch('/api/imaging_artifacts', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        if (!d || !d.ok) return;
        let changed = false;
        if (d.image_url && d.image_url !== latestImageUrl) { latestImageUrl = d.image_url; changed = true; }
        if (d.stats_url && d.stats_url !== statsImageUrl) { statsImageUrl = d.stats_url; changed = true; }
        lastImageFrameCount = atCount;
        if (changed) {
          renderPanel();
          if (openDetailId === SYSTEM_ID && imaging.active) renderSheet();
        }
      })
      .catch(() => {})
      .finally(() => { fetchingArtifacts = false; });
  }

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDetail(); });

  function cancelJob(id) {
    fetch(`/api/jobs/${id}/cancel`, { method: 'POST' }).catch(() => {});
  }

  function removeJob(id) {
    fetch(`/api/jobs/${id}/remove`, { method: 'POST' }).catch(() => {});
  }

  // ── WebSocket ───────────────────────────────────────────────────
  let reconnectDelay = 1000, reconnectTimer = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => { statusDot.classList.add('connected'); reconnectDelay = 1000; };
    ws.onclose = () => {
      statusDot.classList.remove('connected');
      reconnectTimer = setTimeout(() => { reconnectDelay = Math.min(reconnectDelay * 2, 30000); connect(); }, reconnectDelay);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') applyHistory(data.jobs);
      else if (data.type === 'job_event') applyEvent(data.data);
    };
  }

  function sendCommand() {
    const text = input.value.trim();
    if (!text) return;
    if (pendingRename) return submitRename(text);
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'command', command: text }));
    input.value = '';
  }
  sendBtn.addEventListener('click', sendCommand);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommand(); });

  // ── Photo upload (routes notices into the system feed) ──────────
  const photoBtn = document.getElementById('photo-btn');
  const photoInput = document.getElementById('photo-input');
  let pendingRename = null;

  function systemNote(text) {
    // Optimistic local entry in the Observatory feed for upload UX.
    let sys = jobs.get(SYSTEM_ID);
    if (!sys) { sys = normalizeJob({ id: SYSTEM_ID, title: 'Observatory', kind: 'system', resource_class: 'quick', status: 'SYSTEM', created_at: Date.now() / 1000 }); jobs.set(SYSTEM_ID, sys); }
    sys.log.push({ id: null, timestamp: Date.now() / 1000, text, image_url: null, html: null });
    renderPanel(); if (openDetailId === SYSTEM_ID) renderSheet();
  }

  function submitRename(text) {
    const oldFilename = pendingRename; pendingRename = null; input.value = '';
    const fd = new FormData(); fd.append('old_filename', oldFilename); fd.append('new_name', text);
    fetch('/api/rename_upload', { method: 'POST', body: fd })
      .then((r) => r.json())
      .then((d) => systemNote(d.ok ? `Saved as ${d.filename}` : `Rename failed: ${d.error}`))
      .catch((err) => systemNote(`Rename failed: ${err.message}`));
  }

  photoBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0]; if (!file) return;
    photoInput.value = ''; photoBtn.disabled = true;
    systemNote(`🔭 Uploading ${file.name}…`);
    const formData = new FormData();
    formData.append('message', `🔭 ${file.name}`); formData.append('image', file);
    try {
      const resp = await fetch('/api/post', { method: 'POST', body: formData });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (data.filename) { pendingRename = data.filename; systemNote('What DSO is this? Type a name to save it.'); input.focus(); }
    } catch (err) { systemNote(`Upload failed: ${err.message}`); }
    finally { photoBtn.disabled = false; }
  });

  // ── Status ticker ───────────────────────────────────────────────
  const tickerTrack = document.getElementById('ticker-track');
  const ACTIVE_STATES = new Set(['In Flats', 'Active', 'In Process']);
  function buildTickerHTML(metrics) {
    const items = metrics.map((m) => {
      let cls = '';
      if (m.label === 'Safety') cls = m.value === 'Safe' ? ' safe' : ' unsafe';
      else if (m.label === 'State' && ACTIVE_STATES.has(m.value)) cls = ' active';
      else if (m.label === 'Moon') cls = m.value.endsWith('+') ? ' waxing' : ' waning';
      return `<span class="t-item"><span class="t-lbl">${m.label}</span><span class="t-val${cls}">${m.value}</span></span>`;
    }).join('<span class="t-sep">·</span>');
    return items + '<span class="t-sep">·</span>' + items + '<span class="t-sep">·</span>';
  }
  function applyTicker(metrics) {
    tickerTrack.innerHTML = buildTickerHTML(metrics);
    tickerTrack.style.animation = 'none'; void tickerTrack.offsetWidth;
    const dur = Math.max(8, (tickerTrack.scrollWidth / 2) / 90);
    tickerTrack.style.animation = `ticker-scroll ${dur.toFixed(1)}s linear infinite`;
  }
  async function fetchTicker() {
    try {
      const resp = await fetch('/api/ticker', { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok && data.metrics && data.metrics.length > 0) applyTicker(data.metrics);
    } catch (_) {}
  }
  fetchTicker(); setInterval(fetchTicker, 30000);

  // ── Imaging activity ticker ─────────────────────────────────────
  const imagingBar = document.getElementById('imaging-bar');
  const imagingTrack = document.getElementById('imaging-track');
  function buildImagingHTML(data) {
    const lf = data.last_frame || {};
    const items = [
      { label: 'Frames', value: String(data.frame_count) },
      { label: 'Filter', value: lf.filter || '—' },
      { label: 'FWHM', value: lf.fwhm_arcsec != null ? lf.fwhm_arcsec.toFixed(2) + '"' : '—' },
      { label: 'Ecc', value: lf.eccentricity != null ? lf.eccentricity.toFixed(3) : '—' },
      { label: 'Stars', value: lf.star_count != null ? String(lf.star_count) : '—' },
      { label: 'Sky ADU/s', value: lf.sky_adu_per_s != null ? lf.sky_adu_per_s.toFixed(1)
              : lf.sky_mag_arcsec2 != null ? lf.sky_mag_arcsec2.toFixed(2) + ' mag' : '—' },
      { label: 'Time left', value: data.remaining_seconds != null
              ? (() => { const h = Math.floor(data.remaining_seconds / 3600); const m = Math.floor((data.remaining_seconds % 3600) / 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; })()
              : '—' },
    ];
    const inner = items.map((m) => `<span class="it-item"><span class="it-lbl">${m.label}</span><span class="it-val">${m.value}</span></span>`).join('<span class="it-sep">·</span>');
    return inner + '<span class="it-sep">·</span>' + inner + '<span class="it-sep">·</span>';
  }
  function applyImagingTicker(data) {
    imagingTrack.innerHTML = buildImagingHTML(data);
    imagingTrack.style.animation = 'none'; void imagingTrack.offsetWidth;
    const dur = Math.max(8, (imagingTrack.scrollWidth / 2) / 80);
    imagingTrack.style.animation = `ticker-scroll ${dur.toFixed(1)}s linear infinite`;
  }
  async function fetchImagingTicker() {
    try {
      const resp = await fetch('/api/imaging_ticker', { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok && data.active) { imagingBar.style.display = 'flex'; applyImagingTicker(data); }
      else imagingBar.style.display = 'none';
      // Drive the dual-mode feed card: imaging summary while active, feed when idle.
      const prevActive = imaging.active, prevCount = imaging.frame_count;
      imaging = (data && data.ok) ? data : { active: false };
      if (imaging.active !== prevActive || imaging.frame_count !== prevCount) {
        // A new sub is available → fetch the freshly-rendered artifacts now so
        // the card/sheet show the latest frame and its stats immediately,
        // instead of waiting for a tap.
        if (imaging.active && imaging.frame_count !== lastImageFrameCount) fetchImagingArtifacts();
        if (!imaging.active) {
          latestImageUrl = null; statsImageUrl = null; lastImageFrameCount = null;
        }
        renderPanel();
        if (openDetailId === SYSTEM_ID) renderSheet();
      }
    } catch (_) {}
  }
  fetchImagingTicker(); setInterval(fetchImagingTicker, 15000);

  // ── Clock / elapsed tick ────────────────────────────────────────
  function tick() { now = Date.now(); headClock.textContent = fmtClock(now); updateElapsed(); }
  tick(); setInterval(tick, 1000);

  // ── Reconnect handling ──────────────────────────────────────────
  function reconnectNow() {
    clearTimeout(reconnectTimer); reconnectDelay = 1000;
    if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); }
    connect();
  }
  function reconnectIfNeeded() { if (!ws || ws.readyState !== WebSocket.OPEN) reconnectNow(); }
  window.addEventListener('pageshow', (e) => { if (e.persisted) reconnectIfNeeded(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    reconnectIfNeeded(); fetchTicker(); fetchImagingTicker();
  });

  connect();
  input.focus();
})();
</script>
</body>
</html>
