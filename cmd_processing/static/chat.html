<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Observatory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    transition: background 0.3s;
  }

  .status-dot.connected { background: #3fb950; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg.system {
    align-self: flex-start;
    background: #161b22;
    border: 1px solid #30363d;
  }

  .msg.user {
    align-self: flex-end;
    background: #1f3a5f;
    border: 1px solid #2d5a8e;
    color: #a8d4ff;
  }

  .msg .timestamp {
    font-size: 11px;
    color: #484f58;
    margin-bottom: 4px;
  }

  .msg img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 6px;
    margin-top: 6px;
    cursor: pointer;
    display: block;
  }

  .msg img:hover { opacity: 0.85; }

  #input-area {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #cmd-input {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px 14px;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  #cmd-input:focus { border-color: #58a6ff; }

  #cmd-input::placeholder { color: #484f58; }

  #send-btn {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }

  #send-btn:hover { background: #2ea043; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <h1>Iris Observatory</h1>
  </header>

  <div id="messages"></div>

  <div id="input-area">
    <input type="text" id="cmd-input" placeholder="Type a command... (e.g. tonight, status, help)" autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

<script>
(function() {
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('cmd-input');
  const sendBtn = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  let ws = null;
  let reconnectDelay = 1000;
  let lastSeenId = 0;
  let autoScroll = true;

  messagesDiv.addEventListener('scroll', () => {
    const atBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 40;
    autoScroll = atBottom;
  });

  function scrollToBottom() {
    if (autoScroll) {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  }

  function formatTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function renderMessage(msg) {
    if (msg.id <= lastSeenId) return;
    lastSeenId = msg.id;

    const div = document.createElement('div');
    const isUser = msg.text && msg.text.startsWith('> ');
    div.className = 'msg ' + (isUser ? 'user' : 'system');

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = formatTime(msg.timestamp);
    div.appendChild(time);

    const text = isUser ? msg.text.substring(2) : msg.text;
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      div.appendChild(span);
    }

    if (msg.image_url) {
      const img = document.createElement('img');
      img.src = msg.image_url;
      img.alt = 'Response image';
      img.onclick = () => window.open(msg.image_url, '_blank');
      div.appendChild(img);
    }

    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
      statusDot.classList.add('connected');
      reconnectDelay = 1000;
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connect();
      }, reconnectDelay);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        data.messages.forEach(renderMessage);
      } else if (data.type === 'message') {
        renderMessage(data.data);
      }
    };
  }

  function sendCommand() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'command', command: text }));
    input.value = '';
  }

  sendBtn.addEventListener('click', sendCommand);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendCommand();
  });

  connect();
  input.focus();
})();
</script>
</body>
</html>
