<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iris Observatory</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iris">
<meta name="theme-color" content="#161b22">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .status-dot.connected { background: #3fb950; }

  .ticker-wrap {
    flex: 1;
    overflow: hidden;
    min-width: 0;
    mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
  }

  #ticker-track {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }

  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .t-item {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 0 18px;
  }

  .t-lbl {
    font-size: 11px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  .t-val {
    font-size: 13px;
    color: #c9d1d9;
  }

  .t-val.safe    { color: #3fb950; }
  .t-val.unsafe  { color: #f85149; }
  .t-val.active  { color: #58a6ff; }
  .t-val.waxing  { color: #3fb950; }
  .t-val.waning  { color: #d29922; }

  .t-sep {
    color: #30363d;
    font-size: 12px;
    padding: 0 2px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg.system {
    align-self: flex-start;
    background: #161b22;
    border: 1px solid #30363d;
  }

  .msg.user {
    align-self: flex-end;
    background: #1f3a5f;
    border: 1px solid #2d5a8e;
    color: #a8d4ff;
  }

  .msg .timestamp {
    font-size: 11px;
    color: #484f58;
    margin-bottom: 4px;
  }

  .msg img {
    max-width: 100%;
    max-height: 600px;
    border-radius: 6px;
    margin-top: 6px;
    cursor: pointer;
    display: block;
  }

  .msg img:hover { opacity: 0.85; }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 95vw;
    max-height: 92vh;
    border-radius: 6px;
    object-fit: contain;
    touch-action: none;
    will-change: transform;
    cursor: grab;
    transition: transform 0.04s linear;
  }

  #lightbox img.grabbing { cursor: grabbing; }

  #lightbox-close {
    position: fixed;
    top: 14px;
    right: 18px;
    font-size: 28px;
    color: #c9d1d9;
    cursor: pointer;
    line-height: 1;
    user-select: none;
    z-index: 1001;
  }

  #lightbox-close:hover { color: #fff; }

  #input-area {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #cmd-input {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px 14px;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  #cmd-input:focus { border-color: #58a6ff; }

  #cmd-input::placeholder { color: #484f58; }

  #send-btn {
    background: #1f3a5f;
    color: #a8d4ff;
    border: 1px solid #2d5a8e;
    border-radius: 6px;
    padding: 0;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #send-btn:hover { background: #264a7a; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <div class="ticker-wrap">
      <div id="ticker-track"></div>
    </div>
  </header>

  <div id="lightbox">
    <span id="lightbox-close">×</span>
    <img id="lightbox-img" src="" alt="Full size image">
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <input type="text" id="cmd-input" placeholder="Type a command... (e.g. tonight, status, help)" autocomplete="off">
    <button id="send-btn">↑</button>
  </div>

<script>
(function() {
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('cmd-input');
  const sendBtn = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  let ws = null;

  // ── Lightbox pinch-to-zoom ─────────────────────────────────────
  let lbScale = 1, lbX = 0, lbY = 0;
  let lbLastTap = 0;
  let lbPinchStartDist = 0, lbPinchStartScale = 1;
  let lbDragStart = null;

  function lbApplyTransform() {
    lightboxImg.style.transform = `translate(${lbX}px,${lbY}px) scale(${lbScale})`;
  }

  function lbReset() {
    lbScale = 1; lbX = 0; lbY = 0;
    lightboxImg.style.transform = '';
  }

  function pinchDist(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }

  lightboxImg.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      lbPinchStartDist = pinchDist(e.touches);
      lbPinchStartScale = lbScale;
      lbDragStart = null;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      // Double-tap detection
      const now = Date.now();
      if (now - lbLastTap < 300) {
        lbLastTap = 0;
        if (lbScale > 1) { lbReset(); }
        else { lbScale = 2.5; lbApplyTransform(); }
        return;
      }
      lbLastTap = now;
      lbDragStart = { x: t.clientX - lbX, y: t.clientY - lbY };
      lightboxImg.classList.add('grabbing');
    }
  }, { passive: false });

  lightboxImg.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const newDist = pinchDist(e.touches);
      lbScale = Math.min(5, Math.max(1, lbPinchStartScale * (newDist / lbPinchStartDist)));
      lbApplyTransform();
    } else if (e.touches.length === 1 && lbDragStart && lbScale > 1) {
      const t = e.touches[0];
      lbX = t.clientX - lbDragStart.x;
      lbY = t.clientY - lbDragStart.y;
      lbApplyTransform();
    }
  }, { passive: false });

  lightboxImg.addEventListener('touchend', (e) => {
    e.preventDefault();
    lightboxImg.classList.remove('grabbing');
    if (lbScale < 1.05) lbReset(); // snap back if barely zoomed
    lbDragStart = null;
  }, { passive: false });
  // ──────────────────────────────────────────────────────────────

  function openLightbox(url) {
    lbReset();
    lightboxImg.src = url;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lbReset();
    lightboxImg.src = '';
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  let reconnectDelay = 1000;
  let lastSeenId = 0;
  let autoScroll = true;

  messagesDiv.addEventListener('scroll', () => {
    const atBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 40;
    autoScroll = atBottom;
  });

  function scrollToBottom() {
    if (autoScroll) {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  }

  function formatTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function linkify(text) {
    const escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    return escaped.replace(/(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#58a6ff;">$1</a>');
  }

  function renderMessage(msg) {
    if (msg.id !== null && msg.id <= lastSeenId) return;
    if (msg.id !== null) lastSeenId = msg.id;

    const div = document.createElement('div');
    const isUser = msg.text && msg.text.startsWith('> ');
    div.className = 'msg ' + (isUser ? 'user' : 'system');

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = formatTime(msg.timestamp);
    div.appendChild(time);

    if (msg.html) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = msg.html;
      div.appendChild(wrapper);
    } else {
      const text = isUser ? msg.text.substring(2) : msg.text;
      if (text) {
        const span = document.createElement('span');
        span.innerHTML = linkify(text);
        div.appendChild(span);
      }
    }

    if (msg.image_url) {
      const img = document.createElement('img');
      img.src = msg.image_url;
      img.alt = 'Response image';
      img.onclick = () => openLightbox(msg.image_url);
      div.appendChild(img);
    }

    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
      statusDot.classList.add('connected');
      reconnectDelay = 1000;
      stopSpinner();  // clear any stale spinner from before disconnect
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connect();
      }, reconnectDelay);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        lastSeenId = 0;  // server restarted — reset so new IDs aren't filtered out
        data.messages.forEach(renderMessage);
        requestAnimationFrame(() => { messagesDiv.scrollTop = messagesDiv.scrollHeight; });
      } else if (data.type === 'message') {
        stopSpinner();
        renderMessage(data.data);
      }
    };
  }

  function sendCommand() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'command', command: text }));
    input.value = '';
    // Render the echo locally so the spinner isn't killed by the server-side echo message
    renderMessage({ id: null, timestamp: Date.now() / 1000, text: '> ' + text, image_url: null, html: null });
    startSpinner();
  }

  sendBtn.addEventListener('click', sendCommand);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendCommand();
  });

  // ── Working spinner ────────────────────────────────────────────
  const SPIN_CHARS = ['·', '⋆', '✦', '✶', '✷', '✸', '✷', '✶', '✦', '⋆'];
  let spinnerInterval = null;
  let spinIdx = 0;

  function startSpinner() {
    if (spinnerInterval) return; // already spinning
    spinIdx = 0;
    spinnerInterval = setInterval(() => {
      sendBtn.textContent = SPIN_CHARS[spinIdx % SPIN_CHARS.length];
      spinIdx++;
    }, 150);
  }

  function stopSpinner() {
    if (!spinnerInterval) return;
    clearInterval(spinnerInterval);
    spinnerInterval = null;
    sendBtn.textContent = '↑';
  }
  // ──────────────────────────────────────────────────────────────

  // ── Status ticker ─────────────────────────────────────────────
  const tickerTrack = document.getElementById('ticker-track');

  const ACTIVE_STATES = new Set(['In Flats', 'Active', 'In Process']);

  function buildTickerHTML(metrics) {
    const items = metrics.map(m => {
      let cls = '';
      if (m.label === 'Safety') cls = m.value === 'Safe' ? ' safe' : ' unsafe';
      else if (m.label === 'State' && ACTIVE_STATES.has(m.value)) cls = ' active';
      else if (m.label === 'Moon') cls = m.value.endsWith('+') ? ' waxing' : ' waning';
      return `<span class="t-item"><span class="t-lbl">${m.label}</span><span class="t-val${cls}">${m.value}</span></span>`;
    }).join('<span class="t-sep">·</span>');
    return items + '<span class="t-sep">·</span>' + items + '<span class="t-sep">·</span>';
  }

  function applyTicker(metrics) {
    tickerTrack.innerHTML = buildTickerHTML(metrics);
    // Restart animation with duration proportional to content width
    tickerTrack.style.animation = 'none';
    void tickerTrack.offsetWidth; // force reflow
    const halfWidth = tickerTrack.scrollWidth / 2;
    const duration = Math.max(8, halfWidth / 90); // ~90 px/s
    tickerTrack.style.animation = `ticker-scroll ${duration.toFixed(1)}s linear infinite`;
  }

  async function fetchTicker() {
    try {
      const resp = await fetch('/api/ticker', { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok && data.metrics && data.metrics.length > 0) {
        applyTicker(data.metrics);
      }
    } catch (_) {}
  }

  fetchTicker();
  setInterval(fetchTicker, 30000);
  // ──────────────────────────────────────────────────────────────

  connect();
  input.focus();
})();
</script>
</body>
</html>
