# The deploy gate. The observatory pulls the `release` branch at boot;
# `release` is fast-forwarded to `main` ONLY when this workflow is green. A red
# main therefore means the observatory keeps running yesterday's green code --
# which is exactly the failure mode an unattended telescope wants.
#
# Deliberately dependency-free for now: the suite is syntax coverage of every
# deployed file plus unit tests of pure modules, so a bare runner with Python
# and pytest is enough. Heavier stages (machine-table tests, simulated nights
# against fakes) arrive with the architecture plan's Phase 1 and slot in as
# additional steps here -- the gate mechanism does not change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      # The state diagrams are projections of the transition tables; a table
      # edit that forgets to regenerate them fails here, so the docs cannot
      # drift from the machine.
      - run: python scripts/gen_state_diagrams.py --check
      # A red main holds `release` back silently: from 2026-09-10 to 09-13
      # nobody noticed for three days. Say so on the phone. Needs the
      # PUSHOVER_TOKEN and PUSHOVER_USER repository secrets (Settings ->
      # Secrets and variables -> Actions); without them this step is a no-op.
      - name: Pushover on failure
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            echo "Pushover secrets not set; skipping notification"; exit 0
          fi
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          curl -sS --max-time 20 https://api.pushover.net/1/messages.json             --form-string "token=$PUSHOVER_TOKEN"             --form-string "user=$PUSHOVER_USER"             --form-string "title=SRT CI failed -- release held back"             --form-string "message=${COMMIT_SHA:0:7}: $FIRST_LINE"             --form-string "url=$RUN_URL"             --form-string "url_title=Open the run"             --form-string "priority=0" > /dev/null

  release:
    # Fast-forward the branch the observatory deploys from. No --force: under
    # this scheme release is always an ancestor of green main, so a plain push
    # fast-forwards -- and if it ever is NOT an ancestor, something rewrote
    # history and a loud failure here is precisely what we want.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git push origin HEAD:release
