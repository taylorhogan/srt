[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-kasa"
version = "0.10.2"
dependencies = [
    "aiohttp>=3.8.1",
    "mashumaro>=3.13.1",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.2",
    "aiofiles>=23.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kasa"]
